[package]
name = "meow-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "MeoW 消息推送命令行工具（api.chuckfang.com）"

[[bin]]
name = "meow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"

[profile.release]
strip = true
